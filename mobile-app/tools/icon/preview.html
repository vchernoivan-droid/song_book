<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; padding: 18px; background: #14161c; color: #c9cbd6;
         font: 12px -apple-system, Helvetica, sans-serif; }
  h2 { font-size: 11px; font-weight: 600; margin: 0 0 10px; letter-spacing: .05em; text-transform: uppercase; }
  .row { display: flex; align-items: flex-end; gap: 20px; margin-bottom: 18px; }
  .cell { text-align: center; }
  .cell span { display: block; margin-top: 6px; color: #8b8f9e; }
  .tile { border-radius: 22%; }
  .adaptive { background: linear-gradient(135deg, #4154BD, #161E5C); }
  .circle { border-radius: 50%; }
  .squircle { border-radius: 26%; }
  .checker { background-color: #1a1c22;
             background-image: linear-gradient(45deg,#2f333d 25%,transparent 25%),linear-gradient(-45deg,#2f333d 25%,transparent 25%),
                               linear-gradient(45deg,transparent 75%,#2f333d 75%),linear-gradient(-45deg,transparent 75%,#2f333d 75%);
             background-size: 14px 14px; background-position: 0 0,0 7px,7px -7px,-7px 0; }
</style>
</head>
<body>
  <h2>Android: legacy 96/72/48 и adaptive в масках</h2>
  <div class="row">
    <div class="cell"><img class="tile" src="../../android/app/src/main/res/mipmap-xhdpi/ic_launcher.png" width="96"><span>legacy 96</span></div>
    <div class="cell"><img class="tile" src="../../android/app/src/main/res/mipmap-hdpi/ic_launcher.png" width="72"><span>72</span></div>
    <div class="cell"><img class="tile" src="../../android/app/src/main/res/mipmap-mdpi/ic_launcher.png" width="48"><span>48</span></div>
    <div class="cell"><div class="tile adaptive circle" style="width:128px;height:128px"><img src="../../android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png" width="128"></div><span>adaptive, круг</span></div>
    <div class="cell"><div class="tile adaptive squircle" style="width:128px;height:128px"><img src="../../android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png" width="128"></div><span>squircle</span></div>
    <div class="cell checker"><img src="../../android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png" width="128"><span>foreground</span></div>
  </div>

  <h2>iOS 1024, web, macOS</h2>
  <div class="row">
    <div class="cell"><img class="tile squircle" src="../../ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png" width="168"><span>ios, squircle</span></div>
    <div class="cell"><img src="../../ios/Runner/Assets.xcassets/AppIcon.appiconset/Icon-App-1024x1024@1x.png" width="168"><span>ios, как есть</span></div>
    <div class="cell"><img class="tile" src="../../web/icons/Icon-192.png" width="96"><span>web 192</span></div>
    <div class="cell"><img class="tile" src="../../macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_128.png" width="80"><span>macOS 128</span></div>
    <div class="cell"><img class="tile" src="../../macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_32.png" width="32"><span>32</span></div>
    <div class="cell"><img class="tile" src="../../macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_16.png" width="16"><span>16</span></div>
  </div>
</body>
</html>
